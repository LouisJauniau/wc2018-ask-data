[[question]]
id = "fautes_par_match"
question = "Quelle équipe a commis le plus de fautes par match ?"
categorie = "classement"
split = "test"
pieges = ["normalisation_par_match", "faute_commise_ou_subie"]
forme = "premier"
cles = ["equipe"]
sql = '''
WITH f AS (
    SELECT t.team_name AS equipe,
           count(*)::numeric / count(DISTINCT e.match_id) AS fautes_par_match
    FROM sb.events e JOIN sb.teams t ON t.team_id = e.team_id
    WHERE e.type = 'Foul Committed'
    GROUP BY t.team_name
)
SELECT equipe, fautes_par_match FROM f
WHERE fautes_par_match = (SELECT max(fautes_par_match) FROM f)
'''

[[question]]
id = "match_plus_buts"
question = "Quel match a été le plus riche en buts ?"
categorie = "classement"
split = "dev"
pieges = ["egalite"]
forme = "premier"
cles = [["match_id"], ["equipe_domicile", "equipe_exterieur"]]
sql = '''
SELECT m.match_id, h.team_name AS equipe_domicile, a.team_name AS equipe_exterieur,
       m.home_score + m.away_score AS n_buts
FROM sb.matches m
JOIN sb.teams h ON h.team_id = m.home_team_id
JOIN sb.teams a ON a.team_id = m.away_team_id
WHERE m.home_score + m.away_score = (
    SELECT max(home_score + away_score) FROM sb.matches)
'''

[[question]]
id = "plus_encaisse"
question = "Quelle équipe a encaissé le plus de buts ?"
categorie = "classement"
split = "test"
pieges = ["domicile_exterieur", "buts_par_le_score"]
forme = "premier"
cles = ["equipe"]
sql = '''
WITH c AS (
    SELECT team_id, sum(encaisses) AS n_buts_encaisses
    FROM (SELECT home_team_id AS team_id, away_score AS encaisses FROM sb.matches
          UNION ALL
          SELECT away_team_id, home_score FROM sb.matches) x
    GROUP BY team_id
)
SELECT t.team_name AS equipe, c.n_buts_encaisses
FROM c JOIN sb.teams t USING (team_id)
WHERE c.n_buts_encaisses = (SELECT max(n_buts_encaisses) FROM c)
'''

