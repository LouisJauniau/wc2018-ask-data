[[question]]
id = "tirs_concedes"
question = "Quelle équipe a concédé le plus de tirs à ses adversaires ?"
categorie = "classement"
split = "test"
pieges = ["adversaire", "seance_tab"]
forme = "premier"
cles = ["equipe"]
sql = '''
WITH c AS (
    SELECT t.team_id, count(*) AS n_tirs_concedes
    FROM sb.shots s
    JOIN sb.events e USING (event_id)
    JOIN sb.matches m USING (match_id)
    JOIN sb.teams t ON t.team_id IN (m.home_team_id, m.away_team_id)
                   AND t.team_id <> e.team_id
    WHERE e.period < 5
    GROUP BY t.team_id
)
SELECT t.team_name AS equipe, c.n_tirs_concedes
FROM c JOIN sb.teams t USING (team_id)
WHERE c.n_tirs_concedes = (SELECT max(n_tirs_concedes) FROM c)
'''

[[question]]
id = "corners_equipe"
question = "Quelle équipe a tiré le plus de corners ?"
categorie = "classement"
split = "dev"
pieges = ["convention_corner"]
forme = "premier"
cles = ["equipe"]
sql = '''
WITH c AS (
    SELECT t.team_name AS equipe, count(*) AS n_corners
    FROM sb.passes p
    JOIN sb.events e USING (event_id)
    JOIN sb.teams t ON t.team_id = e.team_id
    WHERE p.pass_type = 'Corner'
    GROUP BY t.team_name
)
SELECT equipe, n_corners FROM c WHERE n_corners = (SELECT max(n_corners) FROM c)
'''

[[question]]
id = "classement_xg_top5"
question = "Donne les cinq joueurs avec le plus d'xG cumulé, du premier au cinquième."
categorie = "classement"
split = "test"
pieges = ["seance_tab"]
forme = "ordonne"
cles = ["joueur"]
sql = '''
SELECT pl.player_name AS joueur, sum(s.statsbomb_xg) AS xg
FROM sb.shots s
JOIN sb.events e USING (event_id)
JOIN sb.players pl USING (player_id)
WHERE e.period < 5
GROUP BY pl.player_id, pl.player_name
ORDER BY xg DESC
LIMIT 5
'''


