split = "test"
pieges = ["domicile_exterieur"]
forme = "ensemble"
sql = '''
WITH resultats AS (
    SELECT home_team_id AS team_id, home_score > away_score AS victoire
    FROM sb.matches WHERE stage = 'Group Stage'
    UNION ALL
    SELECT away_team_id, away_score > home_score
    FROM sb.matches WHERE stage = 'Group Stage'
)
SELECT count(*) AS n_equipes
FROM (SELECT team_id FROM resultats GROUP BY team_id
      HAVING NOT bool_or(victoire)) sans
'''

