[[question]]
id = "taux_passes_espagne"
question = "Quel est le taux de passes réussies de l'Espagne ?"
categorie = "ratio"
split = "dev"
pieges = ["passe_reussie_null", "noms_en_anglais", "ratio"]
forme = "ensemble"
echelle_pourcentage = true
sql = '''
SELECT avg((p.outcome IS NULL)::int) AS taux
FROM sb.passes p
JOIN sb.events e USING (event_id)
JOIN sb.teams t ON t.team_id = e.team_id
WHERE t.team_name = 'Spain'
'''

[[question]]
id = "tirs_par_match"
question = "Combien de tirs ont été tentés en moyenne par match ?"
categorie = "ratio"
split = "test"
pieges = ["seance_tab"]
forme = "ensemble"
sql = '''
SELECT (SELECT count(*) FROM sb.shots s JOIN sb.events e USING (event_id)
        WHERE e.period < 5)::numeric
     / (SELECT count(*) FROM sb.matches) AS tirs_par_match
'''

[[question]]
id = "duree_possession"
question = "Quelle est la durée moyenne d'une possession en secondes, hors séances de tirs au but ?"
categorie = "ratio"
split = "dev"
pieges = ["table_derivee"]
forme = "ensemble"
sql = '''
SELECT avg(duration_seconds) AS duree_moyenne FROM sb.possessions WHERE period < 5
'''

[[question]]
id = "part_buts_premiere_periode"
question = "Quelle part des buts a été marquée en première période ?"
categorie = "ratio"
split = "test"
pieges = ["csc", "seance_tab", "ratio"]
forme = "ensemble"
echelle_pourcentage = true
sql = '''
SELECT avg((e.period = 1)::int) AS part
FROM sb.events e LEFT JOIN sb.shots s USING (event_id)
WHERE e.period < 5
  AND (s.outcome = 'Goal' OR e.type = 'Own Goal Against')
'''

[[question]]
id = "taux_cadres_france"
question = "Quel pourcentage des tirs de la France étaient cadrés ?"
categorie = "ratio"
split = "dev"
pieges = ["convention_cadre", "noms_en_anglais", "ratio"]
forme = "ensemble"
echelle_pourcentage = true
sql = '''
SELECT avg((s.outcome IN ('Goal', 'Saved'))::int) AS part_cadres
FROM sb.shots s
JOIN sb.events e USING (event_id)
JOIN sb.teams t ON t.team_id = e.team_id
WHERE t.team_name = 'France' AND e.period < 5
'''

[[question]]
id = "possessions_tir_belgique"
