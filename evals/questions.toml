# Jeu d'evaluation : questions en langage naturel sur la base wc2018.
#
# Chaque question porte une requete de reference ecrite a la main. Le
# resultat de l'agent est compare au resultat de cette requete, pas a son
# texte : deux SQL differents qui renvoient la meme reponse sont tous deux
# justes.
#
# Champs :
#   id           identifiant stable, sert de cle dans les traces
#   question     telle qu'un utilisateur la poserait
#   categorie    comptage | classement | ratio | liste | ambigue | hors_perimetre
#   split        dev (sert a regler le prompt) | test (lu une fois, a la fin)
#   pieges       ce que la question met a l'epreuve, voir PIEGES.md
#   forme        ensemble  lignes comparees sans ordre
#                ordonne   lignes comparees dans l'ordre
#                premier   les N premieres lignes de l'agent doivent etre les
#                          N lignes de reference (N > 1 en cas d'egalite)
#   cles         colonnes du resultat de reference que l'agent doit
#                retrouver. Une liste de listes donne des alternatives.
#   sql          la reference
#   sql_verif    seconde ecriture independante, doit donner le meme resultat
#
# Questions ambigues : pas de sql, une liste d'interpretations, chacune avec
# son sql. Une reponse qui correspond a l'une d'elles est acceptable, mais le
# comportement attendu est de signaler l'ambiguite.
#
# Questions hors perimetre : la base ne contient pas la reponse. Le
# comportement attendu est de le dire, pas de produire un chiffre.
#
# Convention generale, ecrite aussi dans le dictionnaire de donnees : sauf
# mention contraire, une statistique de jeu exclut la seance de tirs au but
# (period = 5), comme le font les statistiques officielles.


# ---------------------------------------------------------------------------
# comptages
# ---------------------------------------------------------------------------

[[question]]
id = "nb_matchs"
question = "Combien de matchs ont été disputés pendant la Coupe du monde 2018 ?"
categorie = "comptage"
split = "dev"
pieges = []
forme = "ensemble"
sql = '''
SELECT count(*) AS n_matchs FROM sb.matches
'''

[[question]]
id = "buts_total"
question = "Combien de buts ont été marqués pendant le tournoi ?"
categorie = "comptage"
split = "test"
pieges = ["buts_par_le_score", "csc", "seance_tab"]
forme = "ensemble"
sql = '''
SELECT sum(home_score + away_score) AS n_buts FROM sb.matches
'''
sql_verif = '''
SELECT count(*) AS n_buts
FROM sb.events e
LEFT JOIN sb.shots s USING (event_id)
WHERE e.period < 5
  AND (s.outcome = 'Goal' OR e.type = 'Own Goal Against')
'''

[[question]]
id = "nb_csc"
question = "Combien de buts contre son camp ont été inscrits ?"
categorie = "comptage"
split = "dev"
pieges = ["csc"]
forme = "ensemble"
sql = '''
SELECT count(*) AS n_csc FROM sb.events WHERE type = 'Own Goal Against'
'''
sql_verif = '''
SELECT count(*) AS n_csc FROM sb.events WHERE type = 'Own Goal For'
'''

[[question]]
id = "buts_france"
question = "Combien de buts la France a-t-elle marqués ?"
categorie = "comptage"
split = "dev"
pieges = ["buts_par_le_score", "csc", "domicile_exterieur", "noms_en_anglais"]
forme = "ensemble"
sql = '''
SELECT sum(CASE WHEN m.home_team_id = t.team_id THEN m.home_score
                ELSE m.away_score END) AS n_buts
FROM sb.matches m
JOIN sb.teams t ON t.team_id IN (m.home_team_id, m.away_team_id)
WHERE t.team_name = 'France'
'''
sql_verif = '''
SELECT count(*) AS n_buts
FROM sb.events e
LEFT JOIN sb.shots s USING (event_id)
JOIN sb.teams t ON t.team_id = e.team_id
WHERE t.team_name = 'France' AND e.period < 5
  AND (s.outcome = 'Goal' OR e.type = 'Own Goal For')
'''

