[[question]]
id = "possession_dominante"
question = "Quelle équipe a eu le plus la possession du ballon ?"
categorie = "ambigue"
split = "dev"
pieges = ["table_derivee"]
ambiguite = "Total sur le tournoi ou moyenne par match ? Mesurée en temps, en nombre de possessions ou en passes ?"

  [[question.interpretations]]
  nom = "temps de possession cumule"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH d AS (SELECT t.team_name AS equipe, sum(p.duration_seconds) AS secondes
             FROM sb.possessions p JOIN sb.teams t USING (team_id) GROUP BY t.team_name)
  SELECT equipe, secondes FROM d WHERE secondes = (SELECT max(secondes) FROM d)
  '''

  [[question.interpretations]]
  nom = "part moyenne du temps de possession par match"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH par_match AS (
      SELECT match_id, team_id,
             sum(duration_seconds)::numeric
             / sum(sum(duration_seconds)) OVER (PARTITION BY match_id) AS part
      FROM sb.possessions GROUP BY match_id, team_id
  ),
  moy AS (SELECT t.team_name AS equipe, avg(part) AS part_moyenne
          FROM par_match JOIN sb.teams t USING (team_id) GROUP BY t.team_name)
  SELECT equipe, part_moyenne FROM moy WHERE part_moyenne = (SELECT max(part_moyenne) FROM moy)
  '''

  [[question.interpretations]]
  nom = "part moyenne des passes par match"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH par_match AS (
      SELECT e.match_id, e.team_id,
             count(*)::numeric / sum(count(*)) OVER (PARTITION BY e.match_id) AS part
      FROM sb.events e WHERE e.type = 'Pass' GROUP BY e.match_id, e.team_id
  ),
  moy AS (SELECT t.team_name AS equipe, avg(part) AS part_moyenne
          FROM par_match JOIN sb.teams t USING (team_id) GROUP BY t.team_name)
  SELECT equipe, part_moyenne FROM moy WHERE part_moyenne = (SELECT max(part_moyenne) FROM moy)
  '''

[[question]]
id = "meilleure_defense"
question = "Quelle équipe a eu la meilleure défense ?"
categorie = "ambigue"
split = "test"
pieges = ["normalisation_par_match", "domicile_exterieur"]
ambiguite = "Moins de buts encaissés au total favorise les équipes éliminées tôt ; par match, ou en xG concédés, la réponse change."

  [[question.interpretations]]
  nom = "buts encaisses par match"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH c AS (
      SELECT team_id, avg(encaisses) AS par_match
      FROM (SELECT home_team_id AS team_id, away_score AS encaisses FROM sb.matches
            UNION ALL SELECT away_team_id, home_score FROM sb.matches) x
      GROUP BY team_id
  )
  SELECT t.team_name AS equipe, c.par_match FROM c JOIN sb.teams t USING (team_id)
  WHERE c.par_match = (SELECT min(par_match) FROM c)
  '''

  [[question.interpretations]]
  nom = "buts encaisses au total"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH c AS (
      SELECT team_id, sum(encaisses) AS total
      FROM (SELECT home_team_id AS team_id, away_score AS encaisses FROM sb.matches
            UNION ALL SELECT away_team_id, home_score FROM sb.matches) x
      GROUP BY team_id
  )
  SELECT t.team_name AS equipe, c.total FROM c JOIN sb.teams t USING (team_id)
  WHERE c.total = (SELECT min(total) FROM c)
  '''

  [[question.interpretations]]
  nom = "xG concedes par match"
  forme = "premier"
  cles = ["equipe"]
  sql = '''
  WITH x AS (
      SELECT t.team_id, sum(s.statsbomb_xg) / count(DISTINCT m.match_id) AS xg_par_match
      FROM sb.matches m
      JOIN sb.teams t ON t.team_id IN (m.home_team_id, m.away_team_id)
      LEFT JOIN sb.events e ON e.match_id = m.match_id AND e.team_id <> t.team_id
                           AND e.type = 'Shot' AND e.period < 5
      LEFT JOIN sb.shots s USING (event_id)
      GROUP BY t.team_id
  )
  SELECT t.team_name AS equipe, x.xg_par_match FROM x JOIN sb.teams t USING (team_id)
  WHERE x.xg_par_match = (SELECT min(xg_par_match) FROM x)
  '''

[[question]]
id = "meilleur_passeur"
question = "Qui a été le meilleur passeur du tournoi ?"
categorie = "ambigue"
split = "dev"
pieges = ["passe_reussie_null", "egalite"]
ambiguite = "En français, « meilleur passeur » désigne d'ordinaire les passes décisives, mais peut s'entendre du volume de passes réussies."

  [[question.interpretations]]
  nom = "passes decisives"
  forme = "premier"
  cles = ["joueur"]
  sql = '''
  WITH a AS (
      SELECT pl.player_name AS joueur, count(*) AS n
      FROM sb.passes p JOIN sb.events e USING (event_id) JOIN sb.players pl USING (player_id)
      WHERE p.goal_assist GROUP BY pl.player_id, pl.player_name
  )
  SELECT joueur, n FROM a WHERE n = (SELECT max(n) FROM a)
  '''

  [[question.interpretations]]
  nom = "passes reussies"
  forme = "premier"
  cles = ["joueur"]
  sql = '''
  WITH p AS (
      SELECT pl.player_name AS joueur, count(*) AS n
      FROM sb.passes x JOIN sb.events e USING (event_id) JOIN sb.players pl USING (player_id)
      WHERE x.outcome IS NULL GROUP BY pl.player_id, pl.player_name
  )
  SELECT joueur, n FROM p WHERE n = (SELECT max(n) FROM p)
  '''

