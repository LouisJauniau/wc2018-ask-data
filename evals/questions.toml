[[question]]
id = "joueurs_expulses"
question = "Quels joueurs ont été expulsés pendant le tournoi ?"
categorie = "liste"
split = "test"
pieges = ["jsonb", "cartons_deux_types"]
forme = "ensemble"
cles = ["joueur"]
sql = '''
SELECT DISTINCT pl.player_name AS joueur
FROM sb.events e JOIN sb.players pl USING (player_id)
WHERE coalesce(e.details -> 'foul_committed' -> 'card' ->> 'name',
               e.details -> 'bad_behaviour'  -> 'card' ->> 'name')
      IN ('Red Card', 'Second Yellow')
'''

[[question]]
id = "stade_finale"
question = "Dans quel stade la finale s'est-elle jouée ?"
categorie = "liste"
split = "dev"
pieges = ["libelle_stage"]
forme = "ensemble"
cles = ["stade"]
sql = '''
SELECT stadium AS stade FROM sb.matches WHERE stage = 'Final'
'''

[[question]]
id = "vainqueur"
question = "Quelle équipe a remporté la Coupe du monde ?"
categorie = "liste"
split = "test"
pieges = ["domicile_exterieur", "libelle_stage"]
forme = "ensemble"
cles = ["equipe"]
sql = '''
SELECT t.team_name AS equipe
FROM sb.matches m
JOIN sb.teams t ON t.team_id = CASE WHEN m.home_score > m.away_score
                                    THEN m.home_team_id ELSE m.away_team_id END
WHERE m.stage = 'Final'
'''

[[question]]
id = "vainqueurs_tab"
question = "Quelles équipes ont remporté une séance de tirs au but, et combien chacune ?"
categorie = "liste"
split = "dev"
pieges = ["seance_tab"]
forme = "ensemble"
cles = ["equipe", "n_seances_gagnees"]
sql = '''
WITH tab AS (
    SELECT e.match_id, e.team_id, count(*) FILTER (WHERE s.outcome = 'Goal') AS reussis
    FROM sb.shots s JOIN sb.events e USING (event_id)
    WHERE e.period = 5
    GROUP BY e.match_id, e.team_id
),
gagnants AS (
    SELECT DISTINCT ON (match_id) match_id, team_id
    FROM tab ORDER BY match_id, reussis DESC
)
SELECT t.team_name AS equipe, count(*) AS n_seances_gagnees
FROM gagnants g JOIN sb.teams t USING (team_id)
GROUP BY t.team_name
'''


