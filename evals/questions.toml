# ---------------------------------------------------------------------------
# classements : "quelle equipe", "quel joueur"
# ---------------------------------------------------------------------------
#
# Les references gardent toutes les lignes ex aequo au lieu d'un LIMIT 1 : un
# LIMIT 1 sur une egalite renvoie une seule des reponses justes, choisie au
# hasard du plan d'execution.

[[question]]
id = "tirs_hors_surface"
question = "Quelle équipe a tenté le plus de tirs hors de la surface ?"
categorie = "classement"
split = "dev"
pieges = ["geometrie_surface", "seance_tab"]
forme = "premier"
cles = ["equipe"]
sql = '''
WITH t AS (
    SELECT tm.team_name AS equipe, count(*) AS n_tirs
    FROM sb.shots s
    JOIN sb.events e USING (event_id)
    JOIN sb.teams tm ON tm.team_id = e.team_id
    WHERE e.period < 5
      AND NOT (e.loc_x >= 102 AND e.loc_y BETWEEN 18 AND 62)
    GROUP BY tm.team_name
)
SELECT equipe, n_tirs FROM t WHERE n_tirs = (SELECT max(n_tirs) FROM t)
'''

