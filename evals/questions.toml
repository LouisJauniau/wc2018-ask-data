[[question]]
id = "victoires_russie"
question = "Combien de matchs la Russie a-t-elle gagnés ?"
categorie = "ambigue"
split = "test"
pieges = ["seance_tab", "domicile_exterieur"]
ambiguite = "Le huitième contre l'Espagne finit 1-1 et se gagne aux tirs au but : victoire ou nul ?"

  [[question.interpretations]]
  nom = "au score"
  forme = "ensemble"
  sql = '''
  SELECT count(*) AS n_victoires
  FROM sb.matches m JOIN sb.teams t ON t.team_id IN (m.home_team_id, m.away_team_id)
  WHERE t.team_name = 'Russia'
    AND ((m.home_team_id = t.team_id AND m.home_score > m.away_score)
      OR (m.away_team_id = t.team_id AND m.away_score > m.home_score))
  '''

  [[question.interpretations]]
  nom = "tirs au but compris"
  forme = "ensemble"
  sql = '''
  WITH tab AS (
      SELECT e.match_id, e.team_id, count(*) FILTER (WHERE s.outcome = 'Goal') AS reussis
      FROM sb.shots s JOIN sb.events e USING (event_id)
      WHERE e.period = 5
      GROUP BY e.match_id, e.team_id
  ),
  gagnant_tab AS (
      SELECT DISTINCT ON (match_id) match_id, team_id FROM tab
      ORDER BY match_id, reussis DESC
  )
  SELECT count(*) AS n_victoires
  FROM sb.matches m
  JOIN sb.teams t ON t.team_id IN (m.home_team_id, m.away_team_id)
  LEFT JOIN gagnant_tab g ON g.match_id = m.match_id
  WHERE t.team_name = 'Russia'
    AND ((m.home_team_id = t.team_id AND m.home_score > m.away_score)
      OR (m.away_team_id = t.team_id AND m.away_score > m.home_score)
      OR g.team_id = t.team_id)
  '''

[[question]]
id = "matchs_nuls"
question = "Combien de matchs se sont terminés sur un match nul ?"
categorie = "ambigue"
split = "dev"
pieges = ["seance_tab", "periode_ou_minute"]
ambiguite = "Nul au score final (prolongation comprise), nul sans vainqueur du tout, ou nul à la fin du temps réglementaire ?"

  [[question.interpretations]]
  nom = "score final egal, tirs au but compris"
  forme = "ensemble"
  sql = '''
  SELECT count(*) AS n_nuls FROM sb.matches WHERE home_score = away_score
  '''

  [[question.interpretations]]
  nom = "sans vainqueur, hors tirs au but"
  forme = "ensemble"
  sql = '''
  SELECT count(*) AS n_nuls
  FROM sb.matches m
  WHERE home_score = away_score
    AND NOT EXISTS (SELECT 1 FROM sb.events e WHERE e.match_id = m.match_id AND e.period = 5)
  '''

  [[question.interpretations]]
  nom = "egalite a la fin du temps reglementaire"
  forme = "ensemble"
  sql = '''
  SELECT count(*) AS n_nuls
  FROM sb.matches m
  WHERE home_score = away_score
     OR EXISTS (SELECT 1 FROM sb.events e WHERE e.match_id = m.match_id AND e.period = 3)
  '''

